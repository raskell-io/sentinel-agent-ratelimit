# Sentinel Agent Registry Manifest
# Rate Limiting Agent - Token bucket rate limiting

[agent]
name = "sentinel-agent-ratelimit"
version = "0.1.0"
description = "Token bucket rate limiting agent for Sentinel reverse proxy"
authors = ["Sentinel Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/raskell-io/sentinel-agent-ratelimit"

[protocol]
version = "0.1"
events = ["request_headers"]

[compatibility]
sentinel-proxy = ">=0.1.0"
sentinel-agent-protocol = "0.1"

[registry]
homepage = "https://sentinel.raskell.io/agents/ratelimit"
documentation = "https://sentinel.raskell.io/docs/agents/ratelimit"
keywords = ["sentinel", "agent", "ratelimit", "rate-limiting", "token-bucket"]
categories = ["rate-limiting"]
